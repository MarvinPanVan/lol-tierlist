name: Champion portraits
on:
  workflow_dispatch:
  push:
    paths: ['pipeline/riot/icons.txt']
permissions:
  contents: write
concurrency: icons
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow
      - run: python pipeline/scripts/icons.py
      - name: Commit portraits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/img/champ public/img/tile public/img/splash public/img/item public/img/spell pipeline/data/ddragon_champions.json pipeline/data/ddragon_items.json
          git diff --cached --quiet && exit 0
          git commit -m "Champion portraits, art, item and ability icons from Data Dragon"
          git pull --rebase && git push
